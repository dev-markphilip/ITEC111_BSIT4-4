<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandy Mae Macusi | Student Profile</title>
    <style>
      body {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #fff0f7 0%, #fbd7e8 55%, #efc5dd 100%);
        color: #51283c;
        margin: 0;
        min-height: 100vh;
        padding: 48px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .profile-card {
        max-width: 560px;
        width: 100%;
        background: rgba(255, 255,255,0.92);
        padding: 44px;
        border: 3px solid #f5a9c9;
        border-radius: 32px 8px 32px 8px;
        box-shadow: 12px 12px 0 #d95d93;
        text-align: center;
      }
      .kicker {
        display: inline-block;
        background: #ffe1ee;
        color: #a62e63;
        border: 1px solid #efa2c3;
        border-radius: 999px;
        padding: 7px 14px;
        margin: 0 0 20px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 1.4px;
      }
      .avatar {
        width: 112px;
        height: 112px;
        border-radius: 28px 8px 28px 8px;
        margin: 0 auto 20px;
        overflow: hidden;
        border: 5px solid #f5a9c9;
        box-shadow: 5px 5px 0 #a62e63;
        transform: rotate(-2deg);
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
      h1 { color: #8f2856; margin: 12px 0 6px; font-size: 2.15rem; }
      .role { color: #c23f78; font-weight: 600; font-size: 0.95rem; margin-bottom: 10px; }
      .student-number {
        display: inline-block;
        color: #71334f;
        background: #fff1f7;
        border-left: 4px solid #db5d94;
        padding: 8px 12px;
        font-weight: 600;
        margin: 0 0 22px;
      }
      .bio {
        color: #71334f;
        background: #fff7fb;
        border: 1px dashed #db86ac;
        border-radius: 14px;
        padding: 18px;
        line-height: 1.6;
        margin: 0 0 28px;
        font-weight: 700;
      }
      .links a {
        display: inline-block;
        background: #cc4b84;
        color: white;
        text-decoration: none;
        font-weight: 700;
        margin: 6px;
        padding: 11px 18px;
        border-radius: 10px 3px 10px 3px;
        box-shadow: 3px 3px 0 #81254e;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }
      .links a:hover { background: #a62e63; transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <main class="profile-card">
      <p class="kicker">MY STUDENT PROFILE</p>
      <div class="avatar"><img src="person.png" alt="Sandy Mae Macusi" /></div>
      <h1>Sandy Mae Macusi</h1>
      <div class="role">BSIT 4-4 Student Developer</div>
      <p class="student-number">Student No. 202306241</p>
      <p class="bio">I AM SANDY MAE MACUSI</p>
      <nav class="links" aria-label="Mga profile link">
        <a href="https://github.com/202306241">GitHub Profile Ko</a>
        <a href="index.html">Bumalik sa Directory</a>
      </nav>
    </main>
  </body>
</html>
