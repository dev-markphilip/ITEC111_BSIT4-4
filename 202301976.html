<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ernest Jules S. Santiago | Student Profile</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }
      .profile-card {
        max-width: 500px;
        width: 100%;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        text-align: center;
      }
      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin: 0 auto 20px;
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      h1 {
        color: #2c3e50;
        margin: 10px 0 5px;
      }
      .role {
        color: #e74c3c;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .student-number {
        color: #34495e;
        font-weight: 600;
        margin: 0 0 20px;
      }
      .bio {
        color: #7f8c8d;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .links a {
        display: inline-block;
        color: #3498db;
        text-decoration: none;
        font-weight: 500;
        margin: 0 8px;
      }
      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="profile-card">
      <div class="avatar">
        <img src="person.png" alt="Ernest Jules S. Santiago" />
      </div>

      <h1>Ernest Jules S. Santiago</h1>
      <div class="role">BSIT 4-4 Student Developer</div>
      <p class="student-number">Student No. 202301976</p>

      <p class="bio">
        Hello, ako si Ernest Jules Santiago. Gusto ko tumulong sa kapwa at
        palakihin nang maayos ang aking anak.
      </p>

      <nav class="links" aria-label="Profile links">
        <a href="https://github.com/202301976">GitHub Profile</a>
        <a href="index.html">Back to Directory</a>
      </nav>
    </main>
  </body>
</html>
